    <script>
      const track = (name, params = {}) => {
        if (typeof window.fbq !== "function") return;
        window.fbq("track", name, params);
      };

      document.addEventListener("click", (event) => {
        const link = event.target.closest("a.link");
        if (!link) return;
        const evt = link.getAttribute("data-event");
        const label = link.getAttribute("data-label") || "";

        if (evt === "contact") {
          track("Contact", { contact_channel: label });
          return;
        }

        if (evt === "view") {
          track("ViewContent", { content_name: label, content_type: "link" });

        }

          track("PageView", { content_name: label });
